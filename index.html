<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>The Last Stand: AP — Tactical FPS</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #040709;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #e4eef2;
  }

  #game-root {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05090c;
  }

  #three-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
  }

  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    z-index: 2;
  }

  #cinematic-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    background: radial-gradient(circle at 50% 48%, transparent 38%, rgba(2, 6, 9, 0.82) 100%);
  }

  /* HUD ultra limpio para no bloquear la inmersión */
  .hud-top-left {
    position: absolute;
    top: 10px;
    left: 14px;
    z-index: 5;
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.96);
    display: none;
  }

  .hud-zone {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.6px;
    color: rgba(212, 236, 242, 0.94);
    text-transform: uppercase;
  }

  .hud-bar-track {
    width: 102px;
    height: 3px;
    background: rgba(255, 255, 255, 0.16);
    margin-top: 4px;
    border-radius: 2px;
    overflow: hidden;
  }

  .hud-bar-fill {
    height: 100%;
    width: 100%;
    transition: width 0.12s linear, background-color 0.2s ease;
  }

  #barricade-fill { background: #3ec6b8; }
  #morale-fill { background: #e87a3e; }

  .hud-top-right {
    position: absolute;
    top: 10px;
    right: 14px;
    z-index: 5;
    pointer-events: none;
    text-align: right;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.96);
    display: none;
  }

  .hud-day {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.4px;
    color: #eaf4f7;
  }

  .hud-sub {
    font-size: 10px;
    font-weight: 600;
    color: rgba(196, 218, 226, 0.82);
    margin-top: 2px;
  }

  .hud-top-right .hud-bar-track {
    margin-left: auto;
    width: 90px;
  }

  /* Control lateral izquierdo para desplazarse entre los 3 carriles */
  #move-pad {
    position: absolute;
    left: 14px;
    bottom: 18px;
    width: 82px;
    height: 82px;
    border-radius: 50%;
    background: rgba(8, 16, 20, 0.36);
    border: 1px solid rgba(130, 210, 220, 0.24);
    z-index: 5;
    pointer-events: none;
    display: none;
    align-items: center;
    justify-content: center;
  }

  #move-knob {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(110, 210, 218, 0.45);
    border: 1px solid rgba(215, 248, 255, 0.72);
    transform: translate(0px, 0px);
  }

  /* Controles compactos abajo a la derecha */
  .hud-bottom-right {
    position: absolute;
    right: 14px;
    bottom: 14px;
    z-index: 6;
    display: none;
    align-items: flex-end;
    gap: 8px;
  }

  .ammo-readout {
    text-align: right;
    margin-right: 4px;
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.96);
  }

  .ammo-weapon {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.1px;
    color: #5fd3c7;
  }

  .ammo-count {
    font-size: 16px;
    font-weight: 800;
    color: #f4fafc;
  }

  .tiny-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(150, 220, 230, 0.26);
    background: rgba(8, 15, 20, 0.56);
    color: #e6f4f7;
    font-size: 10px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(3px);
  }

  .tiny-btn:active {
    transform: scale(0.92);
    background: rgba(62, 198, 184, 0.35);
  }

  .gameplay-active .hud-top-left,
  .gameplay-active .hud-top-right {
    display: block;
  }

  .gameplay-active #move-pad,
  .gameplay-active .hud-bottom-right {
    display: flex;
  }

  #center-banner {
    position: absolute;
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    pointer-events: none;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #d8f6f2;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.98);
    opacity: 0;
    transition: opacity 0.25s ease;
    white-space: nowrap;
  }

  /* Menú Principal */
  #main-menu {
    position: absolute;
    inset: 0;
    z-index: 12;
    background: radial-gradient(circle at 50% 42%, rgba(28, 74, 82, 0.32), rgba(4, 7, 10, 0.93) 74%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px;
  }

  #main-menu.hidden {
    display: none;
  }

  .menu-title {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #ebf6f9;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.96);
  }

  .menu-sub {
    font-size: 11px;
    letter-spacing: 1.6px;
    color: rgba(110, 212, 204, 0.9);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .menu-btn {
    width: 218px;
    padding: 11px 18px;
    border-radius: 6px;
    border: 1px solid rgba(150, 215, 225, 0.24);
    background: rgba(10, 18, 24, 0.82);
    color: #e8f3f7;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
  }

  .menu-btn.primary {
    border-color: rgba(84, 212, 198, 0.78);
    background: rgba(24, 112, 108, 0.42);
    color: #eafffc;
  }

  .menu-btn:active {
    transform: scale(0.97);
  }

  /* Opciones */
  #options-panel {
    position: absolute;
    inset: 0;
    z-index: 14;
    background: rgba(4, 8, 11, 0.94);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px;
  }

  #options-panel.visible {
    display: flex;
  }

  .quality-row {
    display: flex;
    gap: 8px;
  }

  .q-btn {
    padding: 9px 16px;
    border-radius: 5px;
    border: 1px solid rgba(150, 215, 225, 0.24);
    background: rgba(14, 22, 28, 0.88);
    color: #cfe0e6;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.2px;
    cursor: pointer;
  }

  .q-btn.active {
    border-color: #5fd3c7;
    background: rgba(34, 134, 126, 0.48);
    color: #f0fffd;
  }

  #end-overlay {
    position: absolute;
    inset: 0;
    z-index: 13;
    background: rgba(4, 7, 10, 0.86);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
  }

  #end-overlay.visible {
    display: flex;
  }

  #end-title {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #ef6351;
  }

  #end-stats {
    font-size: 12px;
    color: rgba(226, 238, 244, 0.9);
    line-height: 1.5;
  }
</style>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>
<div id="game-root">
  <canvas id="three-canvas"></canvas>
  <canvas id="fx-canvas"></canvas>
  <div id="cinematic-vignette"></div>

  <div class="hud-top-left">
    <div class="hud-zone" id="map-label">DÍAS 1–5 · SECTOR DE CONTENCIÓN</div>
    <div class="hud-bar-track"><div id="barricade-fill" class="hud-bar-fill"></div></div>
    <div class="hud-sub" id="barricade-label">PERÍMETRO 100%</div>
  </div>

  <div class="hud-top-right">
    <div class="hud-day" id="day-label">DÍA 1</div>
    <div class="hud-bar-track"><div id="morale-fill" class="hud-bar-fill"></div></div>
    <div class="hud-sub" id="horde-label">HORDA: 100 · BAJAS: 0</div>
  </div>

  <div id="move-pad">
    <div id="move-knob"></div>
  </div>

  <div id="center-banner"></div>

  <div class="hud-bottom-right">
    <div class="ammo-readout">
      <div class="ammo-weapon" id="weapon-name">GLOCK 19 TACTICAL</div>
      <div class="ammo-count" id="ammo-count">17 / ∞</div>
    </div>
    <button class="tiny-btn" id="btn-reload" type="button">REC</button>
    <button class="tiny-btn" id="btn-weapon" type="button">ARMA</button>
    <button class="tiny-btn" id="btn-fs-hud" type="button">FS</button>
    <button class="tiny-btn" id="btn-menu-hud" type="button">MENÚ</button>
  </div>

  <!-- Menú Principal -->
  <div id="main-menu">
    <div class="menu-title">THE LAST STAND · AP</div>
    <div class="menu-sub">TACTICAL HORROR FPS · REALISMO PBR</div>
    <button class="menu-btn primary" id="btn-new" type="button">NEW</button>
    <button class="menu-btn" id="btn-options" type="button">OPTIONS</button>
    <button class="menu-btn" id="btn-fullscreen" type="button">FULL SCREEN</button>
    <button class="menu-btn" id="btn-exit" type="button">SALIR</button>
  </div>

  <!-- Opciones -->
  <div id="options-panel">
    <div class="menu-title" style="font-size: 18px;">OPTIONS</div>
    <div class="menu-sub">CALIDAD GRÁFICA PBR</div>
    <div class="quality-row">
      <button class="q-btn" data-q="low" type="button">BAJA</button>
      <button class="q-btn" data-q="medium" type="button">MEDIA</button>
      <button class="q-btn" data-q="high" type="button">ALTA</button>
    </div>
    <button class="menu-btn primary" id="btn-options-back" type="button" style="margin-top: 8px;">GUARDAR Y VOLVER</button>
  </div>

  <!-- Fin de partida -->
  <div id="end-overlay">
    <div id="end-title">PERÍMETRO SUPERADO</div>
    <div id="end-stats"></div>
    <button class="menu-btn primary" id="retry-btn" type="button">NEW (REINTENTAR)</button>
    <button class="menu-btn" id="end-to-menu" type="button">MENÚ</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* =========================================================
     1. CONFIGURACIÓN PERSISTENTE (CALIDAD BAJA / MEDIA / ALTA)
     ========================================================= */
  const STORAGE_KEY = 'tls_ap_tactical_fps_v1';
  const QUALITY_PRESETS = {
    low:    { pixelRatio: 0.9,  shadows: false, shadowRes: 512,  fogDensity: 0.036, maxParticles: 24,  bumpScale: 0.015 },
    medium: { pixelRatio: 1.35, shadows: true,  shadowRes: 1024, fogDensity: 0.044, maxParticles: 60,  bumpScale: 0.028 },
    high:   { pixelRatio: 2.0,  shadows: true,  shadowRes: 2048, fogDensity: 0.052, maxParticles: 120, bumpScale: 0.042 }
  };

  let currentQuality = 'high';
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved.quality && QUALITY_PRESETS[saved.quality]) {
      currentQuality = saved.quality;
    }
  } catch (_) {}

  /* =========================================================
     2. AUDIO PROCEDURAL DE TERROR Y ARMAS TÁCTICAS
     ========================================================= */
  class TacticalAudio {
    constructor() {
      this.ctx = null;
      this.noiseBuffer = null;
      this.started = false;
      this.ambientGain = null;
      this.lastGroan = 0;
    }

    unlock() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        const len = this.ctx.sampleRate * 2.0;
        this.noiseBuffer = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const ch = this.noiseBuffer.getChannelData(0);
        for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
      this.startAmbient();
    }

    startAmbient() {
      if (this.started || !this.ctx || !this.noiseBuffer) return;
      this.started = true;
      const now = this.ctx.currentTime;

      const hum = this.ctx.createOscillator();
      hum.type = 'sawtooth';
      hum.frequency.setValueAtTime(48, now);

      const humFilter = this.ctx.createBiquadFilter();
      humFilter.type = 'lowpass';
      humFilter.frequency.setValueAtTime(105, now);

      this.ambientGain = this.ctx.createGain();
      this.ambientGain.gain.setValueAtTime(0.055, now);

      hum.connect(humFilter);
      humFilter.connect(this.ambientGain);
      this.ambientGain.connect(this.ctx.destination);
      hum.start(now);

      const air = this.ctx.createBufferSource();
      air.buffer = this.noiseBuffer;
      air.loop = true;

      const airFilter = this.ctx.createBiquadFilter();
      airFilter.type = 'bandpass';
      airFilter.frequency.setValueAtTime(290, now);
      airFilter.Q.setValueAtTime(5.0, now);

      const airGain = this.ctx.createGain();
      airGain.gain.setValueAtTime(0.05, now);

      air.connect(airFilter);
      airFilter.connect(airGain);
      airGain.connect(this.ctx.destination);
      air.start(now);
    }

    playGlockSuppressed() {
      if (!this.ctx || !this.noiseBuffer) return;
      const now = this.ctx.currentTime;

      const puff = this.ctx.createBufferSource();
      puff.buffer = this.noiseBuffer;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1650, now);
      filter.Q.setValueAtTime(1.5, now);

      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.28, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.075);

      puff.connect(filter);
      filter.connect(g);
      g.connect(this.ctx.destination);
      puff.start(now);
      puff.stop(now + 0.08);

      const slideClick = this.ctx.createOscillator();
      const sg = this.ctx.createGain();
      slideClick.type = 'triangle';
      slideClick.frequency.setValueAtTime(310, now);
      slideClick.frequency.exponentialRampToValueAtTime(85, now + 0.045);
      sg.gain.setValueAtTime(0.24, now);
      sg.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

      slideClick.connect(sg);
      sg.connect(this.ctx.destination);
      slideClick.start(now);
      slideClick.stop(now + 0.055);
    }

    playScarShot() {
      if (!this.ctx || !this.noiseBuffer) return;
      const now = this.ctx.currentTime;

      const blast = this.ctx.createBufferSource();
      blast.buffer = this.noiseBuffer;

      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(1150, now);
      bp.frequency.exponentialRampToValueAtTime(390, now + 0.16);
      bp.Q.setValueAtTime(0.9, now);

      const bg = this.ctx.createGain();
      bg.gain.setValueAtTime(0.42, now);
      bg.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

      blast.connect(bp);
      bp.connect(bg);
      bg.connect(this.ctx.destination);
      blast.start(now);
      blast.stop(now + 0.19);

      const punch = this.ctx.createOscillator();
      const pg = this.ctx.createGain();
      punch.type = 'triangle';
      punch.frequency.setValueAtTime(125, now);
      punch.frequency.exponentialRampToValueAtTime(35, now + 0.1);
      pg.gain.setValueAtTime(0.35, now);
      pg.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

      punch.connect(pg);
      pg.connect(this.ctx.destination);
      punch.start(now);
      punch.stop(now + 0.12);
    }

    playReload() {
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      [0, 0.2].forEach((offset, idx) => {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(idx === 0 ? 520 : 790, now + offset);
        osc.frequency.exponentialRampToValueAtTime(220, now + offset + 0.05);
        g.gain.setValueAtTime(0.08, now + offset);
        g.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.055);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start(now + offset);
        osc.stop(now + offset + 0.06);
      });
    }

    playHit(headshot) {
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(headshot ? 390 : 165, now);
      osc.frequency.exponentialRampToValueAtTime(48, now + 0.06);
      g.gain.setValueAtTime(headshot ? 0.15 : 0.08, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.07);
    }

    playGroan(t) {
      if (!this.ctx || t - this.lastGroan < 3.2) return;
      this.lastGroan = t;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'sawtooth';
      const f = 68 + Math.random() * 24;
      osc.frequency.setValueAtTime(f, now);
      osc.frequency.linearRampToValueAtTime(f * 0.72, now + 0.65);

      const lp = this.ctx.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(230, now);

      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.07, now + 0.15);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

      osc.connect(lp);
      lp.connect(g);
      g.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.72);
    }
  }

  /* =========================================================
     3. MATERIALES PBR (PISO METÁLICO REFLECTANTE, GUANTES, METAL)
     ========================================================= */
  const pbrMaterials = [];

  function createGrateFloorPBR() {
    const size = 512;
    const albedoC = document.createElement('canvas');
    const roughC = document.createElement('canvas');
    const bumpC = document.createElement('canvas');
    albedoC.width = roughC.width = bumpC.width = size;
    albedoC.height = roughC.height = bumpC.height = size;

    const ag = albedoC.getContext('2d');
    const rg = roughC.getContext('2d');
    const bg = bumpC.getContext('2d');

    ag.fillStyle = '#182428';
    ag.fillRect(0, 0, size, size);

    // Superficie metálica semi-pulida con reflejos especulares
    rg.fillStyle = 'rgb(78,78,78)';
    rg.fillRect(0, 0, size, size);

    bg.fillStyle = 'rgb(128,128,128)';
    bg.fillRect(0, 0, size, size);

    const tile = 128;
    for (let gx = 0; gx < size; gx += tile) {
      for (let gy = 0; gy < size; gy += tile) {
        // Marco de baldosa metálica
        ag.strokeStyle = '#0c1215';
        ag.lineWidth = 4;
        ag.strokeRect(gx + 2, gy + 2, tile - 4, tile - 4);

        bg.strokeStyle = 'rgb(70,70,70)';
        bg.lineWidth = 4;
        bg.strokeRect(gx + 2, gy + 2, tile - 4, tile - 4);

        // Relieve antideslizante diagonal
        ag.strokeStyle = 'rgba(130, 175, 185, 0.12)';
        bg.strokeStyle = 'rgb(175,175,175)';
        ag.lineWidth = 1.5;
        bg.lineWidth = 1.5;
        for (let k = 12; k < tile - 12; k += 10) {
          ag.beginPath();
          ag.moveTo(gx + k, gy + 12);
          ag.lineTo(gx + 12, gy + k);
          ag.stroke();

          bg.beginPath();
          bg.moveTo(gx + k, gy + 12);
          bg.lineTo(gx + 12, gy + k);
          bg.stroke();
        }
      }
    }

    // Manchas de desgaste / humedad para variar reflejos
    for (let i = 0; i < 24; i++) {
      const rx = Math.random() * size;
      const ry = Math.random() * size;
      const rad = 18 + Math.random() * 44;
      rg.fillStyle = i % 2 === 0 ? 'rgb(36,36,36)' : 'rgb(145,145,145)';
      rg.beginPath();
      rg.arc(rx, ry, rad, 0, Math.PI * 2);
      rg.fill();
    }

    const map = new THREE.CanvasTexture(albedoC);
    const roughnessMap = new THREE.CanvasTexture(roughC);
    const bumpMap = new THREE.CanvasTexture(bumpC);
    [map, roughnessMap, bumpMap].forEach((t) => {
      t.wrapS = THREE.RepeatWrapping;
      t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(4, 12);
    });

    const mat = new THREE.MeshStandardMaterial({
      map,
      roughnessMap,
      bumpMap,
      bumpScale: QUALITY_PRESETS[currentQuality].bumpScale,
      roughness: 0.9,
      metalness: 0.58
    });
    pbrMaterials.push(mat);
    return mat;
  }

  function createTacticalGlovePBR() {
    const size = 256;
    const albedoC = document.createElement('canvas');
    const bumpC = document.createElement('canvas');
    albedoC.width = bumpC.width = size;
    albedoC.height = bumpC.height = size;

    const ag = albedoC.getContext('2d');
    const bg = bumpC.getContext('2d');

    ag.fillStyle = '#1b2326';
    ag.fillRect(0, 0, size, size);
    bg.fillStyle = 'rgb(128,128,128)';
    bg.fillRect(0, 0, size, size);

    // Microtextura de cuero / kevlar + costuras blancas tácticas
    for (let i = 0; i < 2800; i++) {
      const x = Math.random() * size;
      const y = Math.random() * size;
      ag.fillStyle = Math.random() > 0.5 ? '#242e32' : '#13191c';
      ag.fillRect(x, y, 2, 2);
      bg.fillStyle = Math.random() > 0.5 ? 'rgb(152,152,152)' : 'rgb(104,104,104)';
      bg.fillRect(x, y, 2, 2);
    }

    ag.strokeStyle = 'rgba(215, 228, 232, 0.55)';
    ag.setLineDash([4, 3]);
    ag.lineWidth = 2;
    ag.strokeRect(18, 18, size - 36, size - 36);

    const map = new THREE.CanvasTexture(albedoC);
    const bumpMap = new THREE.CanvasTexture(bumpC);
    const mat = new THREE.MeshStandardMaterial({
      map,
      bumpMap,
      bumpScale: QUALITY_PRESETS[currentQuality].bumpScale,
      roughness: 0.62,
      metalness: 0.15
    });
    pbrMaterials.push(mat);
    return mat;
  }

  function createMetalWallPBR(baseHex, rough = 0.52, metal = 0.65) {
    const size = 256;
    const albedoC = document.createElement('canvas');
    const bumpC = document.createElement('canvas');
    albedoC.width = bumpC.width = size;
    albedoC.height = bumpC.height = size;

    const ag = albedoC.getContext('2d');
    const bg = bumpC.getContext('2d');
    ag.fillStyle = baseHex;
    ag.fillRect(0, 0, size, size);
    bg.fillStyle = 'rgb(128,128,128)';
    bg.fillRect(0, 0, size, size);

    for (let y = 0; y < size; y += 16) {
      ag.fillStyle = 'rgba(0,0,0,0.22)';
      ag.fillRect(0, y, size, 3);
      bg.fillStyle = 'rgb(95,95,95)';
      bg.fillRect(0, y, size, 3);
    }

    const map = new THREE.CanvasTexture(albedoC);
    const bumpMap = new THREE.CanvasTexture(bumpC);
    [map, bumpMap].forEach((t) => {
      t.wrapS = THREE.RepeatWrapping;
      t.wrapT = THREE.RepeatWrapping;
    });

    const mat = new THREE.MeshStandardMaterial({
      map,
      bumpMap,
      bumpScale: QUALITY_PRESETS[currentQuality].bumpScale,
      roughness: rough,
      metalness: metal
    });
    pbrMaterials.push(mat);
    return mat;
  }

    torso.rotation.x = isRunner ? 0.32 : 0.12;
    torso.castShadow = true;

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.175, 16, 16), zSkinMat);

  /* =========================================================
     7. LÓGICA DE JUEGO (100+ ZOMBIS, 3 CARRILES, CADA 5 DÍAS)
     ========================================================= */
  const WEAPONS = {
    glock: { name: 'GLOCK 19 TACTICAL', magSize: 17, fireInterval: 0.16,  reloadTime: 0.85, damage: 34 },
    scar:  { name: 'FN SCAR-L',         magSize: 30, fireInterval: 0.115, reloadTime: 1.25, damage: 42 }
  };

  const LANES_X = [-2.5, 0.0, 2.5];

  const state = {
    mode: 'menu',
    day: 1,
    hordeLeft: 100,
    kills: 0,
    perimeterHp: 100,
    morale: 88,
    weaponKey: 'glock',
    ammo: 17,
    reloading: false,
    reloadTimer: 0,
    fireTimer: 0,
    playerX: 0,
    aimNDC: new THREE.Vector2(0, 0),
    aimScreen: { x: window.innerWidth * 0.5, y: window.innerHeight * 0.5, active: false },
    movePointerId: null,
    aimPointerId: null,
    zombies: [],
    spawnTimer: 0.35,
    recoil: 0,
    elapsed: 0
  };

  function getMapTitleForDay(day) {
    const sector = Math.floor((day - 1) / 5) + 1;
    if (sector === 1) return 'DÍAS 1–5 · SECTOR DE CONTENCIÓN';
    return `DÍAS ${(sector - 1) * 5 + 1}–${sector * 5} · NIVEL SUBTERRÁNEO ${sector}`;
  }

  function applyQuality() {
    const p = QUALITY_PRESETS[currentQuality];
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, p.pixelRatio));
    renderer.shadowMap.enabled = p.shadows;
    ceilingLightA.shadow.mapSize.set(p.shadowRes, p.shadowRes);
    if (ceilingLightA.shadow.map) {
      ceilingLightA.shadow.map.dispose();
      ceilingLightA.shadow.map = null;
    }
    fog.density = p.fogDensity;
    pbrMaterials.forEach((m) => { if (m.bumpMap) m.bumpScale = p.bumpScale; });
    resize();
  }

  function saveQuality(q) {
    currentQuality = q;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ quality: q })); } catch (_) {}
    applyQuality();
    syncQualityButtons();
  }

  function syncQualityButtons() {
    document.querySelectorAll('.q-btn').forEach((b) => {
      b.classList.toggle('active', b.dataset.q === currentQuality);
    });
  }

  function resize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h, false);
    fxCanvas.width = w;
    fxCanvas.height = h;
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();
  }

  function showBanner(txt) {
    const el = document.getElementById('center-banner');
    el.textContent = txt;
    el.style.opacity = '1';
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(() => { el.style.opacity = '0'; }, 1400);
  }

  function updateHud() {
    const w = WEAPONS[state.weaponKey];
    const hpPct = Math.max(0, Math.round(state.perimeterHp));
    const morPct = Math.max(0, Math.min(100, Math.round(state.morale)));

    document.getElementById('map-label').textContent = getMapTitleForDay(state.day);
    document.getElementById('barricade-fill').style.width = `${hpPct}%`;
    document.getElementById('barricade-label').textContent = `PERÍMETRO ${hpPct}%`;
    document.getElementById('day-label').textContent = `DÍA ${state.day}`;
    document.getElementById('morale-fill').style.width = `${morPct}%`;
    document.getElementById('horde-label').textContent =
      `HORDA: ${state.hordeLeft + state.zombies.length} · BAJAS: ${state.kills}`;
    document.getElementById('weapon-name').textContent = w.name;
    document.getElementById('ammo-count').textContent = state.reloading ? 'REC...' : `${state.ammo} / ∞`;
  }

  function startNewGame() {
    audio.unlock();
    for (const z of state.zombies) scene.remove(z.group);
    state.zombies = [];

    state.day = 1;
    state.hordeLeft = 100;
    state.kills = 0;
    state.perimeterHp = 100;
    state.morale = 88;
    state.weaponKey = 'glock';
    state.ammo = WEAPONS.glock.magSize;
    state.reloading = false;
    state.playerX = 0;
    state.mode = 'playing';

    fpRig.pistolGroup.visible = true;
    fpRig.scarGroup.visible = false;

    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('options-panel').classList.remove('visible');
    document.getElementById('end-overlay').classList.remove('visible');
    document.getElementById('game-root').classList.add('gameplay-active');

    showBanner('DÍA 1 · HORDA DE 100 INFECTADOS EN 3 CARRILES');
    updateHud();
  }

  function advanceDay() {
    const prevSector = Math.floor((state.day - 1) / 5);
    state.day++;
    const nextSector = Math.floor((state.day - 1) / 5);

    state.hordeLeft = 100 + (state.day - 1) * 15;
    state.perimeterHp = Math.min(100, state.perimeterHp + 30);
    state.morale = Math.min(100, state.morale + 15);

    if (nextSector !== prevSector) {
      const tint = nextSector % 2 === 1 ? 0x122624 : 0x16222c;
      scene.background.setHex(tint);
      fog.color.setHex(tint);
      showBanner(`NUEVO MAPA · ${getMapTitleForDay(state.day)}`);
    } else {
      showBanner(`DÍA ${state.day} · HORDA DE ${state.hordeLeft}`);
    }
    updateHud();
  }

  function spawnZombie() {
    if (state.hordeLeft <= 0) return;
    state.hordeLeft--;

    const laneIdx = state.hordeLeft % 3;
    const isRunner = Math.random() < 0.42;
    const zMesh = createZombie3D(isRunner, state.hordeLeft);
    const xPos = LANES_X[laneIdx] + (Math.random() - 0.5) * 0.55;
    zMesh.group.position.set(xPos, 0, -14.8 - Math.random() * 1.5);
    scene.add(zMesh.group);

    state.zombies.push({
      ...zMesh,
      isRunner,
      hp: isRunner ? 52 : 92,
      speed: isRunner ? (3.3 + Math.random() * 0.7) : (1.35 + Math.random() * 0.4),
      phase: Math.random() * Math.PI * 2,
      atkTimer: 0
    });
  }

  function startReload() {
    const w = WEAPONS[state.weaponKey];
    if (state.reloading || state.ammo === w.magSize || state.mode !== 'playing') return;
    state.reloading = true;
    state.reloadTimer = w.reloadTime;
    audio.playReload();
    updateHud();
  }

  function switchWeapon() {
    if (state.mode !== 'playing') return;
    state.weaponKey = state.weaponKey === 'glock' ? 'scar' : 'glock';
    state.reloading = false;
    state.ammo = WEAPONS[state.weaponKey].magSize;
    fpRig.pistolGroup.visible = state.weaponKey === 'glock';
    fpRig.scarGroup.visible = state.weaponKey === 'scar';
    audio.playReload();
    updateHud();
  }

  const raycaster = new THREE.Raycaster();

  function fireWeapon() {
    if (state.mode !== 'playing' || state.reloading) return;
    const w = WEAPONS[state.weaponKey];
    if (state.ammo <= 0) {
      startReload();
      return;
    }

    state.fireTimer = w.fireInterval;
    state.ammo--;
    state.recoil = 1.0;
    muzzleLight.intensity = 4.6;
    updateHud();

    if (state.weaponKey === 'glock') audio.playGlockSuppressed();
    else audio.playScarShot();

    raycaster.setFromCamera(state.aimNDC, camera);
    let bestZ = null;
    let bestDist = Infinity;
    let isHead = false;

    for (const z of state.zombies) {
      const center = z.group.position.clone().add(new THREE.Vector3(0, 1.05, 0));
      if (raycaster.ray.distanceSqToPoint(center) < 0.34) {
        const d = camera.position.distanceTo(center);
        if (d < bestDist) {
          bestDist = d;
          bestZ = z;
          const headPos = z.group.position.clone().add(new THREE.Vector3(0, 1.54, 0));
          isHead = raycaster.ray.distanceSqToPoint(headPos) < 0.12;
        }
      }
    }

    if (bestZ) {
      bestZ.hp -= w.damage * (isHead ? 2.2 : 1.0);
      audio.playHit(isHead);
      if (bestZ.hp <= 0) {
        state.kills++;
        state.morale = Math.min(100, state.morale + (isHead ? 4 : 2));
        scene.remove(bestZ.group);
        state.zombies = state.zombies.filter((item) => item !== bestZ);
        updateHud();
      }
    }

    if (state.ammo === 0) startReload();
  }

  /* =========================================================
     8. CONTROLES TÁCTILES, FULL SCREEN Y MENÚ
     ========================================================= */
  function updateAim(clientX, clientY) {
    state.aimScreen.x = clientX;
    state.aimScreen.y = clientY;
    state.aimScreen.active = true;
    const rect = threeCanvas.getBoundingClientRect();
    state.aimNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    state.aimNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  }

  function updateMovePad(clientX) {
    const pad = document.getElementById('move-pad').getBoundingClientRect();
    const norm = Math.max(-1, Math.min(1, ((clientX - pad.left) / pad.width) * 2 - 1));
    state.playerX = norm * 3.1;
    document.getElementById('move-knob').style.transform = `translate(${norm * 22}px, 0px)`;
  }

  threeCanvas.addEventListener('pointerdown', (e) => {
    audio.unlock();
    if (state.mode !== 'playing') return;
    if (e.clientX < window.innerWidth * 0.28 && state.movePointerId === null) {
      state.movePointerId = e.pointerId;
      updateMovePad(e.clientX);
    } else if (state.aimPointerId === null) {
      state.aimPointerId = e.pointerId;
      updateAim(e.clientX, e.clientY);
    } else {
      updateAim(e.clientX, e.clientY);
    }
  });

  window.addEventListener('pointermove', (e) => {
    if (e.pointerId === state.movePointerId) updateMovePad(e.clientX);
    if (e.pointerId === state.aimPointerId) updateAim(e.clientX, e.clientY);
  });

  window.addEventListener('pointerup', (e) => {
    if (e.pointerId === state.movePointerId) state.movePointerId = null;
    if (e.pointerId === state.aimPointerId) state.aimPointerId = null;
  });

  window.addEventListener('pointercancel', (e) => {
    if (e.pointerId === state.movePointerId) state.movePointerId = null;
    if (e.pointerId === state.aimPointerId) state.aimPointerId = null;
  });

  async function toggleFullScreen() {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch (_) {}
  }

  document.getElementById('btn-new').addEventListener('click', startNewGame);
  document.getElementById('retry-btn').addEventListener('click', startNewGame);
  document.getElementById('btn-options').addEventListener('click', () => {
    audio.unlock();
    syncQualityButtons();
    document.getElementById('options-panel').classList.add('visible');
  });
  document.getElementById('btn-options-back').addEventListener('click', () => {
    document.getElementById('options-panel').classList.remove('visible');
  });
  document.querySelectorAll('.q-btn').forEach((btn) => {
    btn.addEventListener('click', () => saveQuality(btn.dataset.q));
  });
  document.getElementById('btn-fullscreen').addEventListener('click', toggleFullScreen);
  document.getElementById('btn-fs-hud').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    toggleFullScreen();
  });
  document.getElementById('btn-exit').addEventListener('click', () => {
    try { window.close(); } catch (_) {}
    showBanner('SESIÓN CERRADA · PUEDES CERRAR LA PESTAÑA');
  });
  document.getElementById('btn-menu-hud').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    state.mode = 'menu';
    document.getElementById('game-root').classList.remove('gameplay-active');
    document.getElementById('main-menu').classList.remove('hidden');
  });
  document.getElementById('btn-reload').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    startReload();
  });
  document.getElementById('btn-weapon').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    switchWeapon();
  });
  document.getElementById('end-to-menu').addEventListener('click', () => {
    state.mode = 'menu';
    document.getElementById('end-overlay').classList.remove('visible');
    document.getElementById('game-root').classList.remove('gameplay-active');
    document.getElementById('main-menu').classList.remove('hidden');
  });

  window.addEventListener('resize', resize);
  syncQualityButtons();
  applyQuality();

  let lastTs = performance.now();
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - lastTs) / 1000);
    lastTs = now;
    state.elapsed += dt;

    backOrangeLight.intensity = 6.0 + Math.sin(state.elapsed * 7) * 0.8;
    muzzleLight.intensity = Math.max(0, muzzleLight.intensity - dt * 45);
    state.recoil = Math.max(0, state.recoil - dt * 8.5);

    if (state.mode === 'playing') {
      audio.playGroan(state.elapsed);

      camera.position.x += (state.playerX - camera.position.x) * Math.min(1, dt * 10);
      camera.rotation.y = -state.aimNDC.x * 0.24;
      camera.rotation.x = state.aimNDC.y * 0.16 + state.recoil * 0.025;

      // Animación del arma y recarga en primera persona
      fpRig.slide.position.z = -0.06 + state.recoil * 0.04;
      fpRig.rig.position.z = -0.46 + state.recoil * 0.045;
      fpRig.rig.position.y = -0.25 + Math.sin(state.elapsed * 3.5) * 0.005;

      if (state.reloading) {
        state.reloadTimer -= dt;
        fpRig.rig.rotation.z = 0.42;
        fpRig.rig.position.y = -0.34;
        if (state.reloadTimer <= 0) {
          state.reloading = false;
          fpRig.rig.rotation.z = 0;
          state.ammo = WEAPONS[state.weaponKey].magSize;
          updateHud();
        }
      } else {
        fpRig.rig.rotation.z = 0;
      }

      state.fireTimer = Math.max(0, state.fireTimer - dt);
      if (state.aimPointerId !== null && state.fireTimer <= 0) {
        fireWeapon();
      }

      if (state.hordeLeft > 0) {
        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0) {
          spawnZombie();
          state.spawnTimer = Math.max(0.24, 0.72 - state.day * 0.03);
        }
      } else if (state.zombies.length === 0) {
        advanceDay();
      }

      for (const z of state.zombies) {
        z.phase += dt * (z.isRunner ? 12 : 6.5);
        if (z.group.position.z < 4.35) {
          z.group.position.z += z.speed * dt;
          z.legL.rotation.x = Math.sin(z.phase) * 0.5;
          z.legR.rotation.x = -Math.sin(z.phase) * 0.5;
        } else {
          z.atkTimer -= dt;
          z.armL.rotation.x = -1.1 + Math.sin(z.phase * 1.4) * 0.45;
          if (z.atkTimer <= 0) {
            z.atkTimer = 1.0;
            state.perimeterHp = Math.max(0, state.perimeterHp - (z.isRunner ? 5 : 3.5));
            state.morale = Math.max(0, state.morale - 2.5);
            updateHud();
            if (state.perimeterHp <= 0) {
              state.mode = 'gameover';
              document.getElementById('end-stats').innerHTML =
                `Sobreviviste hasta <b>DÍA ${state.day}</b> · Bajas: <b>${state.kills}</b>`;
              document.getElementById('end-overlay').classList.add('visible');
              break;
            }
          }
        }
      }
    } else {
      camera.rotation.y = Math.sin(state.elapsed * 0.35) * 0.06;
    }

    renderer.render(scene, camera);

    // Retícula táctica minimalista
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    if (state.mode === 'playing' && state.aimScreen.active) {
      const cx = state.aimScreen.x;
      const cy = state.aimScreen.y;
      const g = 6 + state.recoil * 6;
      const l = 9;
      fxCtx.strokeStyle = 'rgba(130, 238, 226, 0.92)';
      fxCtx.lineWidth = 1.8;
      fxCtx.beginPath();
      fxCtx.moveTo(cx - g - l, cy); fxCtx.lineTo(cx - g, cy);
      fxCtx.moveTo(cx + g, cy); fxCtx.lineTo(cx + g + l, cy);
      fxCtx.moveTo(cx, cy - g - l); fxCtx.lineTo(cx, cy - g);
      fxCtx.moveTo(cx, cy + g); fxCtx.lineTo(cx, cy + g + l);
      fxCtx.stroke();
    }
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
