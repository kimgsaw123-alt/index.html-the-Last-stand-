<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>The Last Stand: AP — Calle Nocturna</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #060709;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #e8ecf2;
  }

  #game-root {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07080a;
  }

  #three-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
  }

  #fx-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;
    z-index: 2;
  }

  #terror-vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    background: radial-gradient(circle at center, transparent 42%, rgba(6, 7, 10, 0.72) 100%);
  }

  /* HUD minimalista para no tapar la acción */
  .hud-top-left {
    position: absolute;
    top: 10px;
    left: 14px;
    z-index: 5;
    pointer-events: none;
    text-shadow: 0 2px 5px rgba(0, 0, 0, 0.95);
    display: none;
  }

  .hud-zone {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: rgba(236, 240, 246, 0.92);
    text-transform: uppercase;
  }

  .hud-bar-track {
    width: 96px;
    height: 3px;
    background: rgba(255, 255, 255, 0.16);
    margin-top: 4px;
    border-radius: 2px;
    overflow: hidden;
  }

  .hud-bar-fill {
    height: 100%;
    width: 100%;
    transition: width 0.12s linear, background-color 0.2s ease;
  }

  #barricade-fill { background: #d99b43; }
  #morale-fill { background: #52c488; }

  .hud-top-right {
    position: absolute;
    top: 10px;
    right: 14px;
    z-index: 5;
    pointer-events: none;
    text-align: right;
    text-shadow: 0 2px 5px rgba(0, 0, 0, 0.95);
    display: none;
  }

  .hud-day {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 1.4px;
    color: #f3f5f8;
  }

  .hud-sub {
    font-size: 10px;
    font-weight: 600;
    color: rgba(215, 222, 232, 0.78);
    margin-top: 2px;
  }

  .hud-top-right .hud-bar-track {
    margin-left: auto;
    width: 86px;
  }

  #move-rail {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 152px;
    border-radius: 16px;
    background: rgba(12, 14, 18, 0.32);
    border: 1px solid rgba(255, 255, 255, 0.12);
    z-index: 5;
    pointer-events: none;
    display: none;
  }

  #move-thumb {
    position: absolute;
    left: 3px;
    top: 62px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: rgba(217, 155, 67, 0.65);
    border: 1px solid rgba(255, 245, 225, 0.75);
  }

  .hud-bottom-right {
    position: absolute;
    right: 14px;
    bottom: 12px;
    z-index: 6;
    display: none;
    align-items: flex-end;
    gap: 8px;
  }

  .ammo-readout {
    text-align: right;
    margin-right: 4px;
    pointer-events: none;
    text-shadow: 0 2px 5px rgba(0, 0, 0, 0.95);
  }

  .ammo-weapon {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #e4b062;
  }

  .ammo-count {
    font-size: 16px;
    font-weight: 800;
    color: #f4f6f9;
  }

  .tiny-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(14, 16, 20, 0.55);
    color: #f0f3f8;
    font-size: 10px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .tiny-btn:active {
    transform: scale(0.92);
    background: rgba(217, 155, 67, 0.35);
  }

  .gameplay-active .hud-top-left,
  .gameplay-active .hud-top-right,
  .gameplay-active #move-rail,
  .gameplay-active .hud-bottom-right {
    display: flex;
  }

  .gameplay-active .hud-top-left,
  .gameplay-active .hud-top-right {
    display: block;
  }

  #center-banner {
    position: absolute;
    top: 15%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    pointer-events: none;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ffe8c2;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
    opacity: 0;
    transition: opacity 0.25s ease;
    white-space: nowrap;
  }

  /* Menú Principal */
  #main-menu {
    position: absolute;
    inset: 0;
    z-index: 12;
    background: radial-gradient(circle at 30% 45%, rgba(95, 28, 12, 0.24), rgba(6, 7, 10, 0.94) 72%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px;
  }

  #main-menu.hidden {
    display: none;
  }

  .menu-title {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #f3f5f8;
    text-shadow: 0 4px 16px rgba(0, 0, 0, 0.9);
  }

  .menu-sub {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: rgba(225, 178, 108, 0.85);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .menu-btn {
    width: 210px;
    padding: 11px 18px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(18, 21, 27, 0.78);
    color: #f2f5f9;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
  }

  .menu-btn.primary {
    border-color: rgba(225, 165, 76, 0.75);
    background: rgba(168, 96, 24, 0.36);
    color: #fff2dc;
  }

  .menu-btn:active {
    transform: scale(0.97);
  }

  /* Panel de Opciones */
  #options-panel {
    position: absolute;
    inset: 0;
    z-index: 14;
    background: rgba(7, 8, 11, 0.92);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px;
  }

  #options-panel.visible {
    display: flex;
  }

  .quality-row {
    display: flex;
    gap: 8px;
  }

  .q-btn {
    padding: 9px 16px;
    border-radius: 5px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(22, 25, 32, 0.85);
    color: #dce2ea;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.2px;
    cursor: pointer;
  }

  .q-btn.active {
    border-color: #e4b062;
    background: rgba(180, 112, 32, 0.45);
    color: #fff5e2;
  }

  /* Pantalla Fin / Derrota */
  #end-overlay {
    position: absolute;
    inset: 0;
    z-index: 13;
    background: rgba(7, 8, 10, 0.82);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
  }

  #end-overlay.visible {
    display: flex;
  }

  #end-title {
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #e65c4f;
  }

  #end-stats {
    font-size: 12px;
    color: rgba(235, 238, 243, 0.88);
    line-height: 1.5;
  }
</style>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>
<body>
<div id="game-root">
  <canvas id="three-canvas"></canvas>
  <canvas id="fx-canvas"></canvas>
  <div id="terror-vignette"></div>

  <div class="hud-top-left">
    <div class="hud-zone" id="map-label">DÍAS 1–5 · CALLE EN LLAMAS</div>
    <div class="hud-bar-track"><div id="barricade-fill" class="hud-bar-fill"></div></div>
    <div class="hud-sub" id="barricade-label">BARRICADA 100%</div>
  </div>

  <div class="hud-top-right">
    <div class="hud-day" id="day-label">DÍA 1 · NOCHE 1</div>
    <div class="hud-bar-track"><div id="morale-fill" class="hud-bar-fill"></div></div>
    <div class="hud-sub" id="horde-label">HORDA: 100 · BAJAS: 0</div>
  </div>

  <div id="move-rail">
    <div id="move-thumb"></div>
  </div>

  <div id="center-banner"></div>

  <div class="hud-bottom-right">
    <div class="ammo-readout">
      <div class="ammo-weapon" id="weapon-name">FN SCAR-L</div>
      <div class="ammo-count" id="ammo-count">30 / ∞</div>
    </div>
    <button class="tiny-btn" id="btn-reload" type="button">REC</button>
    <button class="tiny-btn" id="btn-weapon" type="button">CAMB</button>
    <button class="tiny-btn" id="btn-fs-hud" type="button">FS</button>
    <button class="tiny-btn" id="btn-menu-hud" type="button">MENÚ</button>
  </div>

  <!-- Menú Principal -->
  <div id="main-menu">
    <div class="menu-title">THE LAST STAND · AP</div>
    <div class="menu-sub">CALLE NOCTURNA · SUPERVIVENCIA EXTREMA</div>
    <button class="menu-btn primary" id="btn-new" type="button">NEW</button>
    <button class="menu-btn" id="btn-options" type="button">OPTIONS</button>
    <button class="menu-btn" id="btn-fullscreen" type="button">FULL SCREEN</button>
    <button class="menu-btn" id="btn-exit" type="button">SALIR</button>
  </div>

  <!-- Opciones de Calidad -->
  <div id="options-panel">
    <div class="menu-title" style="font-size: 18px;">OPTIONS</div>
    <div class="menu-sub">CALIDAD GRÁFICA</div>
    <div class="quality-row">
      <button class="q-btn" data-q="low" type="button">BAJA</button>
      <button class="q-btn" data-q="medium" type="button">MEDIA</button>
      <button class="q-btn" data-q="high" type="button">ALTA</button>
    </div>
    <button class="menu-btn primary" id="btn-options-back" type="button" style="margin-top: 8px;">GUARDAR Y VOLVER</button>
  </div>

  <!-- Fin de partida -->
  <div id="end-overlay">
    <div id="end-title">CAÍSTE EN LA NIEBLA</div>
    <div id="end-stats"></div>
    <button class="menu-btn primary" id="retry-btn" type="button">NEW (REINTENTAR)</button>
    <button class="menu-btn" id="end-to-menu" type="button">MENÚ</button>
  </div>
</div>

<script>
(() => {
  'use strict';

  /* =========================================================
     1. CONFIGURACIÓN PERSISTENTE (CALIDAD BAJA / MEDIA / ALTA)
     ========================================================= */
  const STORAGE_KEY = 'tls_ap_options_v1';
  const QUALITY_PRESETS = {
    low:    { pixelRatio: 0.85, shadows: false, fogDensity: 0.036, maxParticles: 24,  fireLight: 1.4,  starCount: 28 },
    medium: { pixelRatio: 1.25, shadows: true,  fogDensity: 0.044, maxParticles: 55,  fireLight: 2.8,  starCount: 55 },
    high:   { pixelRatio: 1.85, shadows: true,  fogDensity: 0.052, maxParticles: 110, fireLight: 4.2,  starCount: 95 }
  };

  let currentQuality = 'medium';
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    if (saved.quality && QUALITY_PRESETS[saved.quality]) {
      currentQuality = saved.quality;
    }
  } catch (_) {}

  function saveQuality(q) {
    currentQuality = q;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ quality: q }));
    } catch (_) {}
    applyQualitySettings();
    syncQualityButtons();
  }

  function syncQualityButtons() {
    document.querySelectorAll('.q-btn').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.q === currentQuality);
    });
  }

  /* =========================================================
     2. AUDIO PROCEDURAL ENVOLVENTE (SCAR-L, GLOCK 19 Y TERROR)
     ========================================================= */
  class HorrorAudioEngine {
    constructor() {
      this.ctx = null;
      this.noiseBuffer = null;
      this.ambientStarted = false;
      this.ambientGain = null;
      this.fireGain = null;
      this.lastGroan = 0;
    }

    unlock() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        this.ctx = new AudioCtx();

        const len = this.ctx.sampleRate * 2.0;
        this.noiseBuffer = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const ch = this.noiseBuffer.getChannelData(0);
        for (let i = 0; i < len; i++) {
          ch[i] = Math.random() * 2 - 1;
        }
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
      this.startAmbientHorror();
    }

    startAmbientHorror() {
      if (this.ambientStarted || !this.ctx || !this.noiseBuffer) return;
      this.ambientStarted = true;
      const now = this.ctx.currentTime;

      // Viento nocturno helado filtrándose entre edificios
      const wind = this.ctx.createBufferSource();
      wind.buffer = this.noiseBuffer;
      wind.loop = true;

      const windFilter = this.ctx.createBiquadFilter();
      windFilter.type = 'bandpass';
      windFilter.frequency.setValueAtTime(340, now);
      windFilter.Q.setValueAtTime(4.5, now);

      const lfo = this.ctx.createOscillator();
      lfo.type = 'sine';
      lfo.frequency.setValueAtTime(0.11, now);
      const lfoGain = this.ctx.createGain();
      lfoGain.gain.setValueAtTime(190, now);
      lfo.connect(lfoGain);
      lfoGain.connect(windFilter.frequency);

      this.ambientGain = this.ctx.createGain();
      this.ambientGain.gain.setValueAtTime(0.085, now);

      wind.connect(windFilter);
      windFilter.connect(this.ambientGain);
      this.ambientGain.connect(this.ctx.destination);

      wind.start(now);
      lfo.start(now);

      // Crepitar grave de carro incendiado
      const fire = this.ctx.createBufferSource();
      fire.buffer = this.noiseBuffer;
      fire.loop = true;

      const fireFilter = this.ctx.createBiquadFilter();
      fireFilter.type = 'lowpass';
      fireFilter.frequency.setValueAtTime(520, now);

      this.fireGain = this.ctx.createGain();
      this.fireGain.gain.setValueAtTime(0.065, now);

      fire.connect(fireFilter);
      fireFilter.connect(this.fireGain);
      this.fireGain.connect(this.ctx.destination);
      fire.start(now);

      // Dron grave de terror psicológico
      const drone = this.ctx.createOscillator();
      drone.type = 'sawtooth';
      drone.frequency.setValueAtTime(46, now);

      const droneFilter = this.ctx.createBiquadFilter();
      droneFilter.type = 'lowpass';
      droneFilter.frequency.setValueAtTime(95, now);

      const droneGain = this.ctx.createGain();
      droneGain.gain.setValueAtTime(0.04, now);

      drone.connect(droneFilter);
      droneFilter.connect(droneGain);
      droneGain.connect(this.ctx.destination);
      drone.start(now);
    }

    setAmbientActive(active) {
      if (!this.ctx || !this.ambientGain || !this.fireGain) return;
      const now = this.ctx.currentTime;
      this.ambientGain.gain.setTargetAtTime(active ? 0.095 : 0.03, now, 0.15);
      this.fireGain.gain.setTargetAtTime(active ? 0.075 : 0.02, now, 0.15);
    }

    // Sonido característico del FN SCAR-L (golpe grave de recámara + estampido seco de fusil)
    playScarShot() {
      if (!this.ctx || !this.noiseBuffer) return;
      const now = this.ctx.currentTime;

      const blast = this.ctx.createBufferSource();
      blast.buffer = this.noiseBuffer;

      const bp = this.ctx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.setValueAtTime(1180, now);
      bp.frequency.exponentialRampToValueAtTime(420, now + 0.16);
      bp.Q.setValueAtTime(0.85, now);

      const blastGain = this.ctx.createGain();
      blastGain.gain.setValueAtTime(0.45, now);
      blastGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

      blast.connect(bp);
      bp.connect(blastGain);
      blastGain.connect(this.ctx.destination);
      blast.start(now);
      blast.stop(now + 0.19);

      // Golpe de pistón / cerrojo característico del SCAR
      const thump = this.ctx.createOscillator();
      const thumpGain = this.ctx.createGain();
      thump.type = 'triangle';
      thump.frequency.setValueAtTime(125, now);
      thump.frequency.exponentialRampToValueAtTime(34, now + 0.11);
      thumpGain.gain.setValueAtTime(0.38, now);
      thumpGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

      thump.connect(thumpGain);
      thumpGain.connect(this.ctx.destination);
      thump.start(now);
      thump.stop(now + 0.13);
    }

    // Sonido característico de Glock 19 (chasquido rápido y limpio de corredera + golpe 9mm)
    playGlockShot() {
      if (!this.ctx || !this.noiseBuffer) return;
      const now = this.ctx.currentTime;

      const snap = this.ctx.createBufferSource();
      snap.buffer = this.noiseBuffer;

      const hp = this.ctx.createBiquadFilter();
      hp.type = 'bandpass';
      hp.frequency.setValueAtTime(2450, now);
      hp.Q.setValueAtTime(1.4, now);

      const snapGain = this.ctx.createGain();
      snapGain.gain.setValueAtTime(0.3, now);
      snapGain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);

      snap.connect(hp);
      hp.connect(snapGain);
      snapGain.connect(this.ctx.destination);
      snap.start(now);
      snap.stop(now + 0.09);

      const crack = this.ctx.createOscillator();
      const crackGain = this.ctx.createGain();
      crack.type = 'sine';
      crack.frequency.setValueAtTime(210, now);
      crack.frequency.exponentialRampToValueAtTime(52, now + 0.065);
      crackGain.gain.setValueAtTime(0.25, now);
      crackGain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

      crack.connect(crackGain);
      crackGain.connect(this.ctx.destination);
      crack.start(now);
      crack.stop(now + 0.075);
    }

    playReload(isScar) {
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const base = isScar ? 440 : 680;
      [0, 0.22].forEach((delay, idx) => {
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(idx === 0 ? base : base * 1.35, now + delay);
        osc.frequency.exponentialRampToValueAtTime(base * 0.45, now + delay + 0.06);
        g.gain.setValueAtTime(0.08, now + delay);
        g.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.065);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start(now + delay);
        osc.stop(now + delay + 0.07);
      });
    }

    playHit(headshot) {
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(headshot ? 360 : 150, now);
      osc.frequency.exponentialRampToValueAtTime(48, now + 0.06);
      g.gain.setValueAtTime(headshot ? 0.14 : 0.08, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.065);
      osc.connect(g);
      g.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.07);
    }

    playZombieGroan(timeSec) {
      if (!this.ctx || timeSec - this.lastGroan < 3.4) return;
      this.lastGroan = timeSec;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'sawtooth';
      const startFreq = 72 + Math.random() * 26;
      osc.frequency.setValueAtTime(startFreq, now);
      osc.frequency.linearRampToValueAtTime(startFreq * 0.72, now + 0.65);

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(240, now);

      g.gain.setValueAtTime(0.001, now);
      g.gain.linearRampToValueAtTime(0.065, now + 0.15);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

      osc.connect(filter);
      filter.connect(g);
      g.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.72);
    }
  }

  /* =========================================================
     3. TEXTURAS PROCEDURALES REALISTAS (Ropa, Asfalto, Metal)
     ========================================================= */
  function makeFabricTexture(baseHex, accentHex, noiseAlpha = 0.25) {
    const c = document.createElement('canvas');
    c.width = 256;
    c.height = 256;
    const g = c.getContext('2d');
    g.fillStyle = baseHex;
    g.fillRect(0, 0, 256, 256);

    // Trama de tela / ripstop
    g.strokeStyle = 'rgba(0,0,0,0.22)';
    g.lineWidth = 1;
    for (let i = 0; i < 256; i += 4) {
      g.beginPath();
      g.moveTo(i, 0); g.lineTo(i, 256);
      g.moveTo(0, i); g.lineTo(256, i);
      g.stroke();
    }

    // Manchas orgánicas de desgaste / camuflaje sutil
    for (let i = 0; i < 48; i++) {
      g.fillStyle = accentHex;
      g.globalAlpha = noiseAlpha * (0.3 + Math.random() * 0.7);
      g.beginPath();
      g.ellipse(
        Math.random() * 256,
        Math.random() * 256,
        8 + Math.random() * 22,
        5 + Math.random() * 14,
        Math.random() * Math.PI,
        0,
        Math.PI * 2
      );
      g.fill();
    }
    g.globalAlpha = 1;

    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  function makeAsphaltTexture() {
    const c = document.createElement('canvas');
    c.width = 512;
    c.height = 512;
    const g = c.getContext('2d');
    g.fillStyle = '#1e2126';
    g.fillRect(0, 0, 512, 512);

    for (let i = 0; i < 6500; i++) {
      const v = 24 + Math.floor(Math.random() * 26);
      g.fillStyle = `rgb(${v},${v + 1},${v + 4})`;
      g.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
    }

    // Líneas viales desgastadas
    g.fillStyle = 'rgba(185, 175, 130, 0.16)';
    g.fillRect(0, 170, 512, 5);
    g.fillRect(0, 340, 512, 5);

    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(4, 2);
    return tex;
  }

  /* =========================================================
     5. SOLDADO REMASTERIZADO (ORGÁNICO + SCAR EN ESPALDA / GLOCK)
     ========================================================= */
  function createRemasteredSoldier() {
    const root = new THREE.Group();

    const suitTex = makeFabricTexture('#262b33', '#363e4a', 0.28);
    const tanTex = makeFabricTexture('#967c52', '#6e5836', 0.25);
    const darkTex = makeFabricTexture('#121417', '#1e2228', 0.2);

    const tanMat = new THREE.MeshStandardMaterial({ map: tanTex, roughness: 0.68 });
    const darkMat = new THREE.MeshStandardMaterial({ map: darkTex, roughness: 0.55 });

    function makeLimb(rTop, rBot, len, mat) {
      const g = new THREE.Group();
      const cyl = new THREE.Mesh(new THREE.CylinderGeometry(rTop, rBot, len, 14), mat);
      cyl.position.y = -len * 0.5;
      cyl.castShadow = true;
      const cap = new THREE.Mesh(new THREE.SphereGeometry(rTop, 12, 12), mat);

    // Piernas orgánicas

    legR.position.set(0.13, 0.76, -0.08);

    torsoGroup.position.set(0, 0.82, 0);

    const sBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.32, 8), darkMat);
    sBarrel.position.y = -0.44;

    // Glock enfundada en muslo cuando se usa el SCAR
    const holsteredGlock = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.16, 0.14), darkMat);
    holsteredGlock.position.set(-0.08, -0.22, -0.18);

    // Cabeza, casco FAST tan y NVG doble
    const headPivot = new THREE.Group();
    headPivot.position.set(0, 0.68, 0);

    const head = new THREE.Mesh(new THREE.SphereGeometry(0.175, 16, 16), darkMat);
    head.castShadow = true;

    const helmet = new THREE.Mesh(
      new THREE.SphereGeometry(0.198, 16, 16, 0, Math.PI * 2, 0, Math.PI * 0.6),

    nvgL.position.set(-0.24, 0.16, 0.05);

    const nvgR = nvgL.clone();
    nvgR.position.set(-0.24, 0.16, -0.05);

    headPivot.add(head, helmet, nvgL, nvgR);

    // Brazos y armas activas

  /* =========================================================
     7. ESTADO DEL JUEGO (100+ ZOMBIS, 3 LÍNEAS, CADA 5 DÍAS)
     ========================================================= */
  const WEAPONS = {
    scar:  { name: 'FN SCAR-L', magSize: 30, fireInterval: 0.125, reloadTime: 1.3, damage: 36, spread: 0.03 },
    glock: { name: 'GLOCK 19',  magSize: 17, fireInterval: 0.17,  reloadTime: 0.85, damage: 25, spread: 0.015 }
  };

  const LANES_Z = [-2.2, 0.1, 2.35]; // Línea alta, media y baja

  const state = {
    mode: 'menu', // 'menu' | 'playing' | 'gameover'
    day: 1,
    totalHordeRemaining: 100,
    kills: 0,
    barricadeHp: 100,
    morale: 85,
    weaponKey: 'scar',
    ammo: 30,
    reloading: false,
    reloadTimer: 0,
    fireTimer: 0,
    playerZ: 0.1,
    aimWorld: new THREE.Vector3(-2.0, 1.05, 0.1),
    aimScreen: { x: 0, y: 0, active: false },
    movePointerId: null,
    aimPointerId: null,
    zombies: [],
    corpses: [],
    bloodPools: [],
    particles: [],
    tracers: [],
    spawnTimer: 0.3,
    elapsed: 0
  };

  function getMapTitleForDay(day) {
    const cycle = Math.floor((day - 1) / 5);
    if (cycle === 0) return `DÍAS 1–5 · CALLE EN LLAMAS`;
    return `DÍAS ${cycle * 5 + 1}–${cycle * 5 + 5} · SECTOR ${cycle + 1}`;
  }

  function applyQualitySettings() {
    const preset = QUALITY_PRESETS[currentQuality];
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, preset.pixelRatio));
    renderer.shadowMap.enabled = preset.shadows;
    fog.density = preset.fogDensity;
    burningCarLight.intensity = preset.fireLight;
    resizeRenderer();
  }

  function resizeRenderer() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setSize(w, h, false);
    fxCanvas.width = w;
    fxCanvas.height = h;
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();
  }

  function syncWeaponVisuals() {
    const isScar = state.weaponKey === 'scar';
    soldier.scarActive.visible = isScar;
    soldier.glockActive.visible = !isScar;
    soldier.slungScar.visible = !isScar;
    soldier.holsteredGlock.visible = isScar;
  }

  function showBanner(text) {
    const el = document.getElementById('center-banner');
    el.textContent = text;
    el.style.opacity = '1';
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(() => { el.style.opacity = '0'; }, 1400);
  }

  function updateHud() {
    const w = WEAPONS[state.weaponKey];
    const barPct = Math.max(0, Math.round(state.barricadeHp));
    const moralePct = Math.max(0, Math.min(100, Math.round(state.morale)));

    document.getElementById('map-label').textContent = getMapTitleForDay(state.day);
    document.getElementById('barricade-fill').style.width = `${barPct}%`;
    document.getElementById('barricade-label').textContent = `BARRICADA ${barPct}%`;
    document.getElementById('day-label').textContent = `DÍA ${state.day}`;
    document.getElementById('morale-fill').style.width = `${moralePct}%`;
    document.getElementById('horde-label').textContent =
      `HORDA: ${state.totalHordeRemaining + state.zombies.length} · BAJAS: ${state.kills}`;
    document.getElementById('weapon-name').textContent = w.name;
    document.getElementById('ammo-count').textContent = state.reloading ? 'REC...' : `${state.ammo} / ∞`;
  }

  function startNewGame() {
    audio.unlock();
    audio.setAmbientActive(true);

    for (const z of state.zombies) scene.remove(z.group);
    state.zombies = [];
    for (const c of state.corpses) scene.remove(c);
    state.corpses = [];
    state.bloodPools = [];
    state.particles = [];
    state.tracers = [];

    state.day = 1;
    state.totalHordeRemaining = 100; // Mínimo 100 zombis en la horda
    state.kills = 0;
    state.barricadeHp = 100;
    state.morale = 85;
    state.weaponKey = 'scar';
    state.ammo = WEAPONS.scar.magSize;
    state.reloading = false;
    state.spawnTimer = 0.25;
    state.mode = 'playing';

    syncWeaponVisuals();
    document.getElementById('main-menu').classList.add('hidden');
    document.getElementById('options-panel').classList.remove('visible');
    document.getElementById('end-overlay').classList.remove('visible');
    document.getElementById('game-root').classList.add('gameplay-active');

    showBanner('DÍA 1 · HORDA DE 100 ZOMBIS EN 3 LÍNEAS');
    updateHud();
  }

  function advanceDay() {
    const prevCycle = Math.floor((state.day - 1) / 5);
    state.day++;
    const nextCycle = Math.floor((state.day - 1) / 5);

    state.totalHordeRemaining = 100 + (state.day - 1) * 15;
    state.barricadeHp = Math.min(100, state.barricadeHp + 30);
    state.morale = Math.min(100, state.morale + 15);
    state.spawnTimer = 0.4;

    if (nextCycle !== prevCycle) {
      // Cambio de mapa cada 5 días
      for (const c of state.corpses) scene.remove(c);
      state.corpses = [];
      state.bloodPools = [];
      showBanner(`NUEVO MAPA · ${getMapTitleForDay(state.day)}`);
    } else {
      showBanner(`DÍA ${state.day} · HORDA DE ${state.totalHordeRemaining}`);
    }
    updateHud();
  }

  function spawnZombieFromLanes() {
    if (state.totalHordeRemaining <= 0) return;
    state.totalHordeRemaining--;

    const laneIdx = state.totalHordeRemaining % 3; // Alta (-2.2), media (0.1), baja (2.35)
    const zJitter = (Math.random() - 0.5) * 0.45;
    const isRunner = Math.random() < 0.42; // Mezcla de lentos y corredores

    const zObj = createRealisticZombie(isRunner, state.totalHordeRemaining);
    zObj.group.position.set(-10.2 - Math.random() * 1.4, 0, LANES_Z[laneIdx] + zJitter);
    scene.add(zObj.group);

    state.zombies.push({
      ...zObj,
      isRunner,
      laneZ: LANES_Z[laneIdx],
      hp: isRunner ? 48 : 85,
      speed: isRunner ? (2.45 + Math.random() * 0.65) : (0.85 + Math.random() * 0.35),
      phase: Math.random() * Math.PI * 2,
      atkTimer: 0
    });
  }

  function startReload() {
    const w = WEAPONS[state.weaponKey];
    if (state.reloading || state.ammo === w.magSize || state.mode !== 'playing') return;
    state.reloading = true;
    state.reloadTimer = w.reloadTime;
    audio.playReload(state.weaponKey === 'scar');
    updateHud();
  }

  function switchWeapon() {
    if (state.mode !== 'playing') return;
    state.weaponKey = state.weaponKey === 'scar' ? 'glock' : 'scar';
    state.reloading = false;
    state.ammo = WEAPONS[state.weaponKey].magSize;
    syncWeaponVisuals();
    audio.playReload(state.weaponKey === 'scar');
    updateHud();
  }

  function fireWeapon() {
    if (state.mode !== 'playing' || state.reloading) return;
    const w = WEAPONS[state.weaponKey];
    if (state.ammo <= 0) {
      startReload();
      return;
    }

    state.fireTimer = w.fireInterval;
    state.ammo--;
    updateHud();

    if (state.weaponKey === 'scar') {
      audio.playScarShot();
    } else {
      audio.playGlockShot();
    }

    muzzleLight.intensity = 4.2;
    soldier.armPivot.position.x = -0.07;

    const tip = state.weaponKey === 'scar' ? soldier.scarTip : soldier.glockTip;
    const origin = new THREE.Vector3();
    tip.getWorldPosition(origin);
    muzzleLight.position.copy(origin);

    const target = state.aimWorld.clone();
    target.x += (Math.random() - 0.5) * w.spread * 14;
    target.z += (Math.random() - 0.5) * w.spread * 14;

    const dir = target.clone().sub(origin).normalize();
    const ray = new THREE.Ray(origin, dir);

    let hitPoint = origin.clone().addScaledVector(dir, 15);
    let hitZombie = null;
    let isHead = false;
    let bestDist = Infinity;

    for (const z of state.zombies) {
      const center = z.group.position.clone().add(new THREE.Vector3(0, 1.0, 0));
      if (ray.distanceSqToPoint(center) < 0.46) {
        const d = origin.distanceTo(center);
        if (d < bestDist) {
          bestDist = d;
          hitZombie = z;
          hitPoint = center;
          const headCenter = z.group.position.clone().add(new THREE.Vector3(0.08, 1.42, 0));
          isHead = ray.distanceSqToPoint(headCenter) < 0.15;
        }
      }
    }

    state.tracers.push({ from: origin.clone(), to: hitPoint.clone(), life: 0.055 });

    if (hitZombie) {
      hitZombie.hp -= w.damage * (isHead ? 1.85 : 1.0);
      audio.playHit(isHead);

      const maxP = QUALITY_PRESETS[currentQuality].maxParticles;
      for (let i = 0; i < 6 && state.particles.length < maxP; i++) {
        state.particles.push({
          pos: hitPoint.clone(),
          vel: new THREE.Vector3((Math.random() - 0.5) * 4.5, 1.5 + Math.random() * 2.5, (Math.random() - 0.5) * 4.5),
          life: 0.35,
          color: '#c92626'
        });
      }

      if (hitZombie.hp <= 0) {
        state.kills++;
        state.morale = Math.min(100, state.morale + (isHead ? 4 : 2));
        state.bloodPools.push({
          x: hitZombie.group.position.x,
          z: hitZombie.group.position.z,
          r: 0.45 + Math.random() * 0.3
        });

        const corpse = new THREE.Mesh(
          new THREE.CylinderGeometry(0.09, 0.09, 0.95, 8),
          zPantsMat
        );
        corpse.rotation.z = Math.PI / 2;
        corpse.rotation.y = Math.random() * Math.PI;
        corpse.position.set(hitZombie.group.position.x, 0.09, hitZombie.group.position.z);
        scene.add(corpse);
        state.corpses.push(corpse);
        if (state.corpses.length > 35) {
          scene.remove(state.corpses.shift());
        }

        scene.remove(hitZombie.group);
        state.zombies = state.zombies.filter((item) => item !== hitZombie);
        updateHud();
      }
    }

    if (state.ammo === 0) startReload();
  }

  /* =========================================================
     8. CONTROLES TÁCTILES, FULL SCREEN Y MENÚ
     ========================================================= */
  const raycaster = new THREE.Raycaster();
  const aimPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -1.0);

  function updateAim(x, y) {
    state.aimScreen.x = x;
    state.aimScreen.y = y;
    state.aimScreen.active = true;
    const rect = threeCanvas.getBoundingClientRect();
    const ndc = new THREE.Vector2(
      ((x - rect.left) / rect.width) * 2 - 1,
      -((y - rect.top) / rect.height) * 2 + 1
    );
    raycaster.setFromCamera(ndc, camera);
    const pt = new THREE.Vector3();
    if (raycaster.ray.intersectPlane(aimPlane, pt)) {
      pt.x = Math.max(-9.8, Math.min(4.8, pt.x));
      pt.z = Math.max(-3.0, Math.min(3.0, pt.z));
      state.aimWorld.copy(pt);
    }
  }

  function updateMoveY(clientY) {
    const rail = document.getElementById('move-rail').getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (clientY - rail.top) / rail.height));
    state.playerZ = -2.5 + ratio * 5.0;
    document.getElementById('move-thumb').style.transform = `translateY(${(ratio - 0.5) * 116}px)`;
  }

  threeCanvas.addEventListener('pointerdown', (e) => {
    audio.unlock();
    if (state.mode !== 'playing') return;
    if (e.clientX < window.innerWidth * 0.22 && state.movePointerId === null) {
      state.movePointerId = e.pointerId;
      updateMoveY(e.clientY);
    } else if (state.aimPointerId === null) {
      state.aimPointerId = e.pointerId;
      updateAim(e.clientX, e.clientY);
    } else {
      updateAim(e.clientX, e.clientY);
    }
  });

  window.addEventListener('pointermove', (e) => {
    if (e.pointerId === state.movePointerId) updateMoveY(e.clientY);
    if (e.pointerId === state.aimPointerId) updateAim(e.clientX, e.clientY);
  });

  window.addEventListener('pointerup', (e) => {
    if (e.pointerId === state.movePointerId) state.movePointerId = null;
    if (e.pointerId === state.aimPointerId) state.aimPointerId = null;
  });

  window.addEventListener('pointercancel', (e) => {
    if (e.pointerId === state.movePointerId) state.movePointerId = null;
    if (e.pointerId === state.aimPointerId) state.aimPointerId = null;
  });

  async function toggleFullScreen() {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (_) {}
  }

  document.getElementById('btn-new').addEventListener('click', startNewGame);
  document.getElementById('retry-btn').addEventListener('click', startNewGame);
  document.getElementById('btn-options').addEventListener('click', () => {
    audio.unlock();
    syncQualityButtons();
    document.getElementById('options-panel').classList.add('visible');
  });
  document.getElementById('btn-options-back').addEventListener('click', () => {
    document.getElementById('options-panel').classList.remove('visible');
  });
  document.querySelectorAll('.q-btn').forEach((btn) => {
    btn.addEventListener('click', () => saveQuality(btn.dataset.q));
  });
  document.getElementById('btn-fullscreen').addEventListener('click', toggleFullScreen);
  document.getElementById('btn-fs-hud').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    toggleFullScreen();
  });
  document.getElementById('btn-exit').addEventListener('click', () => {
    audio.setAmbientActive(false);
    try { window.close(); } catch (_) {}
    showBanner('SESIÓN CERRADA · PUEDES CERRAR LA PESTAÑA');
  });
  document.getElementById('btn-menu-hud').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    state.mode = 'menu';
    audio.setAmbientActive(false);
    document.getElementById('game-root').classList.remove('gameplay-active');
    document.getElementById('main-menu').classList.remove('hidden');
  });
  document.getElementById('btn-reload').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    startReload();
  });
  document.getElementById('btn-weapon').addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    switchWeapon();
  });
  document.getElementById('end-to-menu').addEventListener('click', () => {
    state.mode = 'menu';
    document.getElementById('end-overlay').classList.remove('visible');
    document.getElementById('game-root').classList.remove('gameplay-active');
    document.getElementById('main-menu').classList.remove('hidden');
  });

  function worldToScreen(v) {
    const p = v.clone().project(camera);
    return {
      x: (p.x * 0.5 + 0.5) * fxCanvas.width,
      y: (-p.y * 0.5 + 0.5) * fxCanvas.height
    };
  }

  window.addEventListener('resize', resizeRenderer);
  syncQualityButtons();
  applyQualitySettings();
  syncWeaponVisuals();

  let lastTime = performance.now();

  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    state.elapsed += dt;

    // Parpadeo orgánico del fuego del carro incendiado
    const flicker = 0.72 + Math.sin(state.elapsed * 19) * 0.18 + Math.random() * 0.15;
    burningCarLight.intensity = QUALITY_PRESETS[currentQuality].fireLight * flicker;
    emberCore.material.color.setHex(Math.random() > 0.35 ? 0xff4d12 : 0xff8c24);

    // Humo / chispas del carro incendiado
    const maxP = QUALITY_PRESETS[currentQuality].maxParticles;
    if (state.particles.length < maxP && Math.random() < 0.55) {
      state.particles.push({
        pos: new THREE.Vector3(-3.6 + (Math.random() - 0.5) * 0.7, 1.1, -1.55 + (Math.random() - 0.5) * 0.5),
        vel: new THREE.Vector3((Math.random() - 0.5) * 0.6, 1.4 + Math.random() * 1.4, (Math.random() - 0.5) * 0.6),
        life: 0.75,
        color: Math.random() > 0.4 ? 'rgba(90, 96, 106, 0.45)' : 'rgba(255, 110, 35, 0.75)'
      });
    }

    if (state.mode === 'playing') {
      audio.playZombieGroan(state.elapsed);

      soldier.root.position.z += (state.playerZ - soldier.root.position.z) * Math.min(1, dt * 14);
      const dx = state.aimWorld.x - soldier.root.position.x;
      const dz = state.aimWorld.z - soldier.root.position.z;
      const yaw = Math.atan2(-dz, -dx);
      soldier.torsoGroup.rotation.y = yaw * 0.5;
      soldier.armPivot.rotation.y = yaw * 0.45;

      soldier.armPivot.position.x += (-0.14 - soldier.armPivot.position.x) * Math.min(1, dt * 18);
      muzzleLight.intensity = Math.max(0, muzzleLight.intensity - dt * 45);

      // Animación de recarga
      if (state.reloading) {
        state.reloadTimer -= dt;
        soldier.armPivot.rotation.z = Math.sin(state.elapsed * 22) * 0.25;
        if (state.reloadTimer <= 0) {
          state.reloading = false;
          soldier.armPivot.rotation.z = 0;
          state.ammo = WEAPONS[state.weaponKey].magSize;
          updateHud();
        }
      } else {
        soldier.armPivot.rotation.z = 0;
      }

      state.fireTimer = Math.max(0, state.fireTimer - dt);
      if (state.aimPointerId !== null && state.fireTimer <= 0) {
        fireWeapon();
      }

      if (state.totalHordeRemaining > 0) {
        state.spawnTimer -= dt;
        if (state.spawnTimer <= 0) {
          spawnZombieFromLanes();
          state.spawnTimer = Math.max(0.22, 0.68 - state.day * 0.03);
        }
      } else if (state.zombies.length === 0) {
        advanceDay();
      }

      for (const z of state.zombies) {
        z.phase += dt * (z.isRunner ? 12 : 6.2);
        const barX = 4.35;
        if (z.group.position.x < barX) {
          z.group.position.x += z.speed * dt;
          z.group.position.z += (z.laneZ - z.group.position.z) * dt * 1.4;
          z.legL.rotation.z = Math.sin(z.phase) * 0.5;
          z.legR.rotation.z = -Math.sin(z.phase) * 0.5;
        } else {
          z.atkTimer -= dt;
          z.armL.rotation.z = 0.6 + Math.sin(z.phase * 1.3) * 0.4;
          if (z.atkTimer <= 0) {
            z.atkTimer = 1.0;
            state.barricadeHp = Math.max(0, state.barricadeHp - (z.isRunner ? 4.5 : 3.2));
            state.morale = Math.max(0, state.morale - 2.2);
            updateHud();
            if (state.barricadeHp <= 0) {
              state.mode = 'gameover';
              document.getElementById('end-stats').innerHTML =
                `Sobreviviste hasta <b>DÍA ${state.day}</b> · Bajas: <b>${state.kills}</b>`;
              document.getElementById('end-overlay').classList.add('visible');
              break;
            }
          }
        }
      }

      const dmgRatio = 1 - state.barricadeHp / 100;
      barricadeMeshes.forEach((m, i) => {
        m.position.y = 0.44 - dmgRatio * 0.12;
        m.rotation.z = (i % 2 === 0 ? 1 : -1) * dmgRatio * 0.1;
      });
    } else {
      // Vista atmosférica en menú
      soldier.torsoGroup.rotation.y = Math.sin(state.elapsed * 0.6) * 0.14;
    }

    renderer.render(scene, camera);

    // Efectos 2D (charcos, trazadoras, humo/sangre, mira cruz)
    fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);

    for (const pool of state.bloodPools) {
      const sp = worldToScreen(new THREE.Vector3(pool.x, 0.02, pool.z));
      fxCtx.fillStyle = 'rgba(130, 12, 16, 0.65)';
      fxCtx.beginPath();
      fxCtx.ellipse(sp.x, sp.y, pool.r * 32, pool.r * 16, 0, 0, Math.PI * 2);
      fxCtx.fill();
    }

    for (let i = state.tracers.length - 1; i >= 0; i--) {
      const tr = state.tracers[i];
      tr.life -= dt;
      if (tr.life <= 0) { state.tracers.splice(i, 1); continue; }
      const a = worldToScreen(tr.from);
      const b = worldToScreen(tr.to);
      fxCtx.strokeStyle = 'rgba(255, 214, 125, 0.85)';
      fxCtx.lineWidth = 2;
      fxCtx.beginPath(); fxCtx.moveTo(a.x, a.y); fxCtx.lineTo(b.x, b.y); fxCtx.stroke();
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
      const p = state.particles[i];
      p.life -= dt;
      p.pos.addScaledVector(p.vel, dt);
      if (p.life <= 0) { state.particles.splice(i, 1); continue; }
      const sp = worldToScreen(p.pos);
      fxCtx.fillStyle = p.color;
      fxCtx.beginPath();
      fxCtx.arc(sp.x, sp.y, 3.2, 0, Math.PI * 2);
      fxCtx.fill();
    }

    if (state.mode === 'playing' && state.aimScreen.active) {
      const cx = state.aimScreen.x;
      const cy = state.aimScreen.y;
      const g = 6;
      const l = 8;
      fxCtx.strokeStyle = 'rgba(248, 250, 252, 0.92)';
      fxCtx.lineWidth = 1.8;
      fxCtx.beginPath();
      fxCtx.moveTo(cx - g - l, cy); fxCtx.lineTo(cx - g, cy);
      fxCtx.moveTo(cx + g, cy); fxCtx.lineTo(cx + g + l, cy);
      fxCtx.moveTo(cx, cy - g - l); fxCtx.lineTo(cx, cy - g);
      fxCtx.moveTo(cx, cy + g); fxCtx.lineTo(cx, cy + g + l);
      fxCtx.stroke();
    }
  }

  requestAnimationFrame(loop);
})();
</script>
